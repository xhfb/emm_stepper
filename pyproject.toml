[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emm_stepper"
version = "1.0.0"
description = "ZDT X42S 第二代闭环步进电机控制库 (仅支持Emm固件)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.7"
authors = [
    {name = "XHFB", email = "2285273839@qq.com"}
]
keywords = ["stepper-motor", "motor-control", "serial", "emm-firmware", "zdt"]
classifiers = [
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black",
    "flake8",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/yourusername/emm_stepper"
Repository = "https://github.com/yourusername/emm_stepper"
Issues = "https://github.com/yourusername/emm_stepper/issues"

[tool.setuptools.packages.find]
include = ["emm_stepper*"]

[tool.black]
line-length = 100
target-version = ['py37', 'py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.7"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
